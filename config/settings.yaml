# Global scraper settings.

# Server-side search terms. The scraper issues one paged query per term per
# company, so a job matching any term is captured. Empty string "" means
# "all jobs" (no filter) — remove it if you only want keyword-matched roles.
search_terms:
  - intern
  - new grad
  - university
  - early career
  - entry level
  - junior
  - graduate
  # Replaced with next year at run time ("Summer 2027 Intern"). Measured with
  # src/accuracy.py: finds Workday roles none of the words above match.
  - "{next_year}"

# Pagination
page_limit: 20          # Workday caps at ~20 per request
# Hard cap per search term (Workday search is relevance-ranked; see below).
max_pages_per_term: 25
# Workday: keep paging a term only while a page has at least this many
# intern/new-grad titles.
workday_min_relevant_per_page: 2

# Boards that have ever listed an intern/new-grad job are scraped every run;
# the rest of a source's boards are split into N slices, one slice per run
# (so each is still checked every N hours). Keeps CI under its 30-min limit.
# Every run, every board of these sources gets a cheap "what's new?" check:
# newest postings (any title, classified locally) until a page holds nothing
# posted in the last window_days. Finds new jobs within the hour; the full
# keyword sweep then only needs to run on the rotation above.
# window_days 1: runs are hourly, so a day of margin is enough; measured
# 2026-10-03 at 12% fewer Workday requests than 2 days, nothing missed.
recency_check:
  workday: {window_days: 1, max_pages: 8}
  icims: {window_days: 2, max_pages: 5}

# Sources split across parallel CI scrape jobs (.github/workflows/scrape.yml
# matrix: one "SOURCE:k/n" part per shard, plus "rest" for everything else).
# Workday rate-limits per client IP, so two machines ~halve its time.
ci_shards:
  workday: 2
  icims: 1         # its own job: the slowest source (globally spaced requests)

# ATS sources to skip entirely (e.g. while a site is blocking us).
disabled_sources: []

long_tail_rotation:
  # Boards with open entry-level jobs every 2nd run (postings stay open for
  # weeks, so a 2-hour detection delay costs nothing); the rest every 6th.
  # Measured 2026-09-30: every-run Workday took 19 min, iCIMS 13 min.
  # Workday / iCIMS: this is the *full sweep* cadence; every board also gets
  # the recency check below on every run.
  workday: {hot: 6, tail: 6}
  icims: {hot: 4, tail: 4}

# Politeness
request_timeout: 30     # seconds
delay_between_requests: 0.5  # seconds, to avoid hammering a tenant
scrape_workers: 8       # companies scraped concurrently (different hosts)
# Workday tenants are separate hosts ({tenant}.wdN.myworkdayjobs.com), so they
# can go wide; Ashby/Greenhouse/Lever each share one API host and stay at the default.
scrape_workers_by_source:
  workday: 32        # Workday rate-limits per client IP (429s at 64)
  smartrecruiters: 16
  oracle: 16          # each tenant is its own host
  icims: 2            # one shared edge; requests are also globally spaced

# Classification: keyword pass is always on. The zero-shot fallback (facebook/bart-large-mnli)
# only runs for ambiguous titles when this is true. Model downloads ~1.6GB on first use.
# Keep this OFF in CI: ~15k ambiguous titles per run takes hours on a CPU runner
# and times out the workflow. Inconclusive titles default to "mid", which is never
# announced anyway, so the fallback adds nothing for notifications.
use_llm_fallback: false

# Enrichment: fetch the full description of each new intern/new_grad posting
# (a handful of extra requests per run) and parse it into flags — visa
# sponsorship (no/yes), security clearance, graduation-year window. Flags show
# up in the Discord embed, the Google Sheet, and the DB.
enrich_descriptions: true
# Cap on per-run detail fetches (~0.5s each) so a burst can't hit the CI timeout.
enrich_max_per_run: 400
# Each run also reads this many never-read descriptions of open jobs, so the
# Sheet's sponsorship / citizenship / clearance columns fill in (PhD and
# research internships first). ~0.25s each with 8 parallel fetches, so
# ~4 min for 1000; the backlog is cleared in about a day.
enrich_backlog_per_run: 1000
# When true, jobs whose description explicitly rules out visa sponsorship
# (or requires US citizenship) are dropped from Discord/Sheets announcements.
exclude_no_sponsorship: false

# Personal filters (src/profile.py) for Discord, the Today / This Week tabs
# and the PhD tab; All Open stays unfiltered. Unknown values never filter.
profile:
  enabled: false
  grad_year:               # e.g. 2027: hide jobs that name only other grad years
  needs_sponsorship: false # true: hide "no sponsorship" / US-citizens-only jobs
  us_citizen: true         # false: hide citizenship- or clearance-required jobs
  locations: []            # e.g. [CA, WA, New York, Remote]; empty = anywhere in the US

# Discord: new jobs are collected and posted as one digest every N hours.
discord:
  digest_hours: 3

# Only announce jobs in these functions (classify.categorize / curated-list
# category). Remove the key to announce every function (sales, legal, ...).
announce_categories: [software, data_ml, hardware, quant, product]

# Repost / stale-listing detection (src/repost.py).
reposts:
  announce: annotate        # annotate = tag in Discord; suppress = don't announce
  linkedin_min_age_days: 30 # LinkedIn id older than its post date by this much
  stale_after_days: 30      # source post date this old when first seen

# Aggregator rows (Indeed/LinkedIn/...) come from time-windowed searches, so
# they expire after this many days unseen rather than on first absence.
aggregator_ttl_days: 21
# Every run deletes listings older than this many days, measured from the
# source's post date (or latest repost date) when it has one, else from when
# we first saw it. Deleted ids are remembered so a still-open old listing is
# never re-announced; new postings already this old aren't stored at all.
max_listing_age_days: 60
# Sources whose postings legitimately stay open for months (Apple lists its
# internship programs from spring). They're kept regardless of post date and
# deleted instead once unseen for 14 days. Don't add sources with years-old
# "always open" listings (e.g. SmartRecruiters ads dated 2015).
age_limit_exempt_sources: [apple]

# Roles persisted to jobs.db (and sent to the Google Sheet). Full-board ATS
# APIs return every role; storing mid/senior from ~6,000 boards pushes the
# committed DB past GitHub's 100 MB file limit. Remove the key to keep all.
store_roles: [intern, new_grad]
# Only used when store_roles is unset: removed mid/senior rows older than
# this are deleted.
prune_removed_after_days: 30

# Community-curated early-career lists in SimplifyJobs' listings.json format.
# The list's role (intern/new_grad) is trusted over the title's wording.
curated_lists:
  enabled: true
  repos:
    - {repo: SimplifyJobs/Summer2026-Internships, role: intern}
    - {repo: SimplifyJobs/Summer2027-Internships, role: intern}
    - {repo: SimplifyJobs/New-Grad-Positions, role: new_grad}
    - {repo: vanshb03/Summer2026-Internships, role: intern}
    - {repo: vanshb03/New-Grad-2026, role: new_grad}

# External job board scraping via JobSpy (Indeed, LinkedIn, Glassdoor, ZipRecruiter).
jobspy:
  enabled: true
  sites:
    - indeed
    - linkedin      # guest API; uses JOBSPY_PROXY when set, else direct
    - glassdoor
    - zip_recruiter
  # glassdoor and zip_recruiter require a residential proxy from CI (set JOBSPY_PROXY secret).
  # Without it, only Indeed works from GitHub Actions datacenter IPs.
  search_terms:
    - software engineer intern
    - software engineering internship
    - new grad software engineer
    - entry level software engineer
  location: United States
  results_per_term: 100
  hours_old: 72    # only jobs posted in the last 3 days
