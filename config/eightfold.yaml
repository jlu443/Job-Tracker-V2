# Eightfold career sites (src/eightfold_scraper.py). host serves
# /api/pcsx/search; domain is the company's, passed as ?domain=; tenant
# namespaces job ids (ef_{tenant}_{id}). Checked 2026-10-03. Micron, NVIDIA,
# CACI, Citi and Morgan Stanley also answer on Eightfold, but their Workday
# sites are already scraped (companies.yaml), so they'd only duplicate.
# Starbucks answers too but had no entry-level roles (its "intern" search
# returns store jobs).
companies:
- tenant: microsoft
  host: apply.careers.microsoft.com
  domain: microsoft.com
  name: Microsoft
- tenant: qualcomm
  host: qualcomm.eightfold.ai
  domain: qualcomm.com
  name: Qualcomm
# Found through curated-list links, 2026-10-06 (entry-level titles then):
# John Deere 55, Eaton 33, Boston Scientific 12. None has another scraped board.
- tenant: johndeere
  host: johndeere.eightfold.ai
  domain: johndeere.com
  name: John Deere
- tenant: eaton
  host: eaton.eightfold.ai
  domain: eaton.com
  name: Eaton
- tenant: bostonscientific
  host: bostonscientific.eightfold.ai
  domain: bostonscientific.com
  name: Boston Scientific
