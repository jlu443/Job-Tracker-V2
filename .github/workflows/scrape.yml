name: scrape-jobs

on:
  schedule:
    # Fallback only. The hourly trigger is external: cron-job.org POSTs to
    # .../actions/workflows/scrape.yml/dispatches each hour (a fine-grained
    # token with Actions read/write on this repo), because GitHub's own
    # scheduler delivered hourly runs only every 4-7 hours. If that trigger
    # stops (e.g. the token expires), this keeps runs going.
    - cron: "37 */3 * * *"
  workflow_dispatch: {}   # the external hourly trigger, and manual runs

# contents: write lets the job replace the DB asset on the release, and push
# the rare keepalive commit.
permissions:
  contents: write

# Don't let two runs race on the DB.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # jobs.db lives as an asset on this release instead of in git: committing a
  # ~25 MB binary every hour grew the repo by hundreds of MB a day.
  DB_RELEASE: db-latest

jobs:
  # Stage 1: scrape in parallel. Each part runs on its own machine, so the
  # two Workday halves get separate IPs (Workday rate-limits per client IP).
  # Parts only read a copy of the DB (board rotation); nothing is uploaded.
  # Keep the workday parts in line with settings.yaml -> ci_shards.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ["workday:0/2", "workday:1/2", "icims:0/1", "rest"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download database (read-only copy)
        run: bash .github/scripts/download_db.sh

      - name: Scrape ${{ matrix.part }}
        env:
          JOBSPY_PROXY: ${{ secrets.JOBSPY_PROXY }}  # optional residential proxy
        run: |
          mkdir -p parts
          python -m src.main --scrape-part "${{ matrix.part }}" \
            --out "parts/part-${{ strategy.job-index }}.json.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: part-${{ strategy.job-index }}
          path: parts/
          retention-days: 1

  # Stage 2: merge the parts and run everything else (classify, sync,
  # enrich, Discord, Sheet), then save the DB. Runs even if a part failed:
  # that part's boards simply aren't "complete", so nothing is wrongly
  # marked removed, and the next run picks them up.
  process:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      # A broken parser/migration must not touch the DB.
      - run: python -m pytest -q tests

      - uses: actions/download-artifact@v8
        with:
          pattern: part-*
          path: parts

      - name: Download database
        id: download
        run: bash .github/scripts/download_db.sh

      - name: Process
        # Leaves headroom inside the job timeout for the upload step.
        timeout-minutes: 21
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}  # optional
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}  # optional, for the daily digest link
        run: python -m src.main --from-parts parts

      - name: Upload database
        # Even if processing failed late: the DB is synced before notify
        # runs, so throwing it away would make this run's postings look "new"
        # (and be re-announced) next time.
        if: always() && steps.download.outcome == 'success'
        run: |
          python - <<'EOF'
          import sqlite3, sys
          ok = sqlite3.connect("data/jobs.db").execute("PRAGMA integrity_check").fetchone()[0]
          if ok != "ok":
              sys.exit(f"jobs.db failed integrity check: {ok}")
          EOF
          gh release upload "$DB_RELEASE" data/jobs.db --clobber
          # One snapshot per day, last 7 kept, for rollback.
          snap="jobs-$(date -u +%F).db"
          cp data/jobs.db "$snap"
          gh release upload "$DB_RELEASE" "$snap" --clobber
          gh release view "$DB_RELEASE" --json assets --jq '.assets[].name' \
            | grep -E '^jobs-[0-9-]+\.db$' | sort | head -n -7 \
            | xargs -r -n1 gh release delete-asset "$DB_RELEASE" -y

      - name: Keep the schedule alive
        # GitHub disables cron workflows in public repos after 60 days with no
        # commits; hourly DB commits used to prevent that.
        if: always()
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          fi
