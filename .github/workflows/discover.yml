name: discover-boards

# Daily: find company job boards the tracker doesn't scrape yet. Harvests
# ATS links from the curated GitHub lists, JobSpy postings and the apply
# links of the jobs we already track (an employer posting an internship on
# Indeed with a Workday link gets its Workday site added), validates
# each new board against its ATS's API, gives it a real company name, and
# commits the config. New boards' existing jobs are stored silently on their
# first scrape, so this never floods Discord.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  DB_RELEASE: db-latest

concurrency:
  group: discover-boards
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download database (read-only; for its apply links)
        run: bash .github/scripts/download_db.sh

      # Common Crawl runs weekly instead (discover-crawl.yml): it's slow.
      - name: Discover new boards
        run: python -m src.discover --no-cc --db data/jobs.db

      - name: Name new boards
        run: python -m src.names

      - name: Commit config changes
        run: |
          if git diff --quiet -- config/ && [ -z "$(git status --porcelain -- config/)" ]; then
            echo "No new boards."
            exit 0
          fi
          git diff --stat -- config/
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/
          git commit -m "chore: discover new job boards [skip ci]"
          git pull --rebase origin main
          git push
